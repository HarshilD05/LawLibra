<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>LawLibra - Calendar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-surface":"#191c1e","on-surface-variant":"#45474c","background":"#f7f9fc","primary-container":"#101c2e","secondary":"#755b00","outline":"#75777d","outline-variant":"#c5c6cd","surface":"#f7f9fc","surface-container-lowest":"#ffffff","secondary-container":"#fed977","surface-container-low":"#f2f4f7","surface-container":"#eceef1","on-secondary-container":"#785d00","on-primary-container":"#79849b","error":"#ba1a1a"},fontFamily:{headline:["Manrope"],body:["Inter"]}}}}</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
:root{--sidebar-w:224px;}
html,body{overflow-x:hidden;}
aside{width:var(--sidebar-w)!important;}
.ll-main{margin-left:var(--sidebar-w);}
header.ll-topnav{left:var(--sidebar-w)!important;right:0!important;width:auto!important;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day-cell{min-height:110px;box-sizing:border-box;}
#cal-grid{min-height:440px;}
</style>
</head>
<body class="bg-background text-on-surface font-body">
<aside id="ll-sidebar" class="bg-[#0D1F3C] h-screen fixed left-0 top-0 flex flex-col py-6 px-4 z-50 shadow-2xl"></aside>
<header class="ll-topnav fixed top-0 right-0 h-16 z-40 bg-white/90 backdrop-blur-xl flex items-center justify-between px-8 shadow-sm">
  <div class="flex items-center gap-4 flex-1 max-w-md"><div class="relative w-full"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span><input class="w-full bg-surface-container-low border-none rounded-xl pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-secondary-container transition-all" placeholder="Search events..." type="text"/></div></div>
  <div class="flex items-center gap-3">
    <button id="dark-toggle" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><span class="material-symbols-outlined">dark_mode</span></button>
    <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg relative"><span class="material-symbols-outlined">notifications</span><span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full hidden" id="notif-badge"></span></button>
    <div class="h-8 w-px bg-outline-variant/30"></div>
    <div id="hdr-avatar" class="w-9 h-9 rounded-full bg-primary-container flex items-center justify-center text-amber-400 font-bold text-sm cursor-pointer">?</div>
  </div>
</header>
<main class="ll-main mt-16 p-6 min-h-screen bg-background">
  <div class="flex gap-6">
    <!-- Left panel -->
    <div class="w-72 flex-shrink-0 space-y-5">
      <!-- Mini calendar -->
      <div class="bg-surface-container-lowest rounded-xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-5">
          <h3 class="font-headline font-bold text-on-surface" id="mini-cal-title">—</h3>
          <div class="flex gap-1">
            <button id="prev-month" class="p-1.5 hover:bg-surface-container rounded-lg transition-colors"><span class="material-symbols-outlined text-lg">chevron_left</span></button>
            <button id="next-month" class="p-1.5 hover:bg-surface-container rounded-lg transition-colors"><span class="material-symbols-outlined text-lg">chevron_right</span></button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-y-2 text-center mb-2">
          <span class="text-[10px] font-bold text-on-primary-container">M</span><span class="text-[10px] font-bold text-on-primary-container">T</span><span class="text-[10px] font-bold text-on-primary-container">W</span><span class="text-[10px] font-bold text-on-primary-container">T</span><span class="text-[10px] font-bold text-on-primary-container">F</span><span class="text-[10px] font-bold text-error/60">S</span><span class="text-[10px] font-bold text-error/60">S</span>
        </div>
        <div class="grid grid-cols-7 gap-y-1 text-center" id="mini-cal-grid"></div>
      </div>
      <!-- Calendars filter -->
      <div class="bg-surface-container-lowest rounded-xl shadow-sm p-5">
        <h4 class="text-xs font-bold uppercase tracking-widest text-on-primary-container/60 mb-3">Event Types</h4>
        <div class="space-y-2">
          <label class="flex items-center gap-3 p-2 hover:bg-surface-container rounded-lg cursor-pointer"><input type="checkbox" checked data-type="HEARING" class="type-filter rounded"/><span class="text-sm font-medium">Hearings</span><span class="ml-auto w-2 h-2 rounded-full bg-red-500"></span></label>
          <label class="flex items-center gap-3 p-2 hover:bg-surface-container rounded-lg cursor-pointer"><input type="checkbox" checked data-type="MEETING" class="type-filter rounded"/><span class="text-sm font-medium">Meetings</span><span class="ml-auto w-2 h-2 rounded-full bg-blue-500"></span></label>
          <label class="flex items-center gap-3 p-2 hover:bg-surface-container rounded-lg cursor-pointer"><input type="checkbox" checked data-type="REMINDER" class="type-filter rounded"/><span class="text-sm font-medium">Reminders</span><span class="ml-auto w-2 h-2 rounded-full bg-amber-500"></span></label>
        </div>
      </div>
      <!-- AI insight -->
      <div class="bg-primary-container text-white p-5 rounded-xl relative overflow-hidden">
        <span class="material-symbols-outlined text-secondary-container absolute -right-2 -bottom-2 text-6xl opacity-20" style="font-variation-settings:'FILL' 1">auto_awesome</span>
        <p class="text-xs font-bold text-secondary-container mb-2 flex items-center gap-1"><span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">auto_awesome</span>LIBRA AI INSIGHT</p>
        <p class="text-xs leading-relaxed opacity-90" id="ai-insight">Analyzing your calendar for conflicts...</p>
      </div>
    </div>
    <!-- Main calendar -->
    <div class="flex-1 min-w-0">
      <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
        <!-- Header -->
        <div class="p-5 flex items-center justify-between border-b border-surface-container-low">
          <div class="flex items-center gap-4">
            <h2 class="font-headline font-extrabold text-xl text-on-surface" id="cal-title">—</h2>
          </div>
          <button onclick="openEventModal()" class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-white shadow-md hover:scale-[1.02] transition-all text-sm" style="background:linear-gradient(135deg,#101c2e,#3c475b)"><span class="material-symbols-outlined text-lg">add</span>Schedule Event</button>
        </div>
        <!-- Days header -->
        <div class="cal-grid border-b border-surface-container-low">
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Mon</div>
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Tue</div>
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Wed</div>
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Thu</div>
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Fri</div>
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Sat</div>
          <div class="py-3 text-center text-[11px] font-extrabold text-on-primary-container/40 uppercase">Sun</div>
        </div>
        <!-- Calendar grid -->
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
    <!-- Right: Today's schedule -->
    <div class="w-64 flex-shrink-0">
      <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
        <div class="p-4 border-b border-surface-container-low">
          <p class="text-xs font-bold text-on-primary-container/60 uppercase tracking-widest mb-0.5">Selected Day</p>
          <h3 class="font-headline font-bold text-base" id="selected-day-title">—</h3>
        </div>
        <div class="p-3 space-y-3 max-h-[calc(100vh-200px)] overflow-y-auto" id="day-events"></div>
      </div>
    </div>
  </div>
</main>
<script src="app.js"></script>
<script src="nav.js"></script>
<script>
const TYPE_COLORS = {
  HEARING:  { bg:"bg-red-50", text:"text-red-700", border:"border-red-400", dot:"bg-red-500" },
  MEETING:  { bg:"bg-blue-50", text:"text-blue-700", border:"border-blue-400", dot:"bg-blue-500" },
  REMINDER: { bg:"bg-amber-50", text:"text-amber-700", border:"border-amber-400", dot:"bg-amber-500" },
};
const DEFAULT_COLOR = { bg:"bg-slate-50", text:"text-slate-700", border:"border-slate-300", dot:"bg-slate-400" };

let viewYear, viewMonth, selectedDate;

function getColor(type) { return TYPE_COLORS[type] || DEFAULT_COLOR; }

function getActiveTypes() {
  return [...document.querySelectorAll(".type-filter:checked")].map(cb => cb.dataset.type);
}

function renderMiniCal(year, month) {
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("mini-cal-title").textContent = names[month] + " " + year;
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = (firstDay === 0 ? 6 : firstDay - 1); // Mon-based
  const today = new Date().toISOString().split("T")[0];
  const todayYear = new Date().getFullYear();
  const todayMonth = new Date().getMonth();
  const todayDay = new Date().getDate();
  const events = LawLibra.DB.events.forMonth(year, month);
  let html = "";
  for (let i = 0; i < startOffset; i++) html += `<span></span>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isToday = year===todayYear && month===todayMonth && d===todayDay;
    const isSelected = dateStr === selectedDate;
    const hasEvent = events.some(e => e.date === dateStr);
    html += `<button onclick="selectDay('${dateStr}')" class="w-7 h-7 mx-auto text-xs flex flex-col items-center justify-center rounded-full transition-colors relative ${isSelected?"bg-primary-container text-white font-bold":isToday?"border-2 border-primary-container text-primary-container font-bold":"hover:bg-surface-container text-on-surface"}">${d}${hasEvent&&!isSelected?`<span class="absolute bottom-0.5 w-1 h-1 rounded-full bg-secondary"></span>`:""}</button>`;
  }
  document.getElementById("mini-cal-grid").innerHTML = html;
}

function renderMainCal(year, month) {
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("cal-title").textContent = months[month] + " " + year;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const todayStr = new Date().toISOString().split("T")[0];
  const activeTypes = getActiveTypes();
  const events = LawLibra.DB.events.forMonth(year, month);
  let html = "";
  for (let i = 0; i < startOffset; i++) {
    html += `<div class="day-cell border-r border-b border-surface-container-low bg-surface-container-low/20 p-2"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedDate;
    const dayEvents = events.filter(e => e.date === dateStr && activeTypes.includes(e.type));
    const isLastCol = (startOffset + d) % 7 === 0;
    html += `<div class="day-cell ${isLastCol?"":"border-r"} border-b border-surface-container-low p-2 hover:bg-surface-container-low/30 transition-colors cursor-pointer ${isSelected?"ring-2 ring-inset ring-primary-container":""}" onclick="selectDay('${dateStr}')">
      <span class="text-xs font-bold ${isToday?"inline-flex w-6 h-6 rounded-full bg-primary-container text-white items-center justify-center":"text-on-primary-container/60"}">${d}</span>
      <div class="mt-1 space-y-0.5">
        ${dayEvents.slice(0,2).map(ev => {
          const c = getColor(ev.type);
          return `<div class="${c.bg} ${c.text} text-[10px] font-semibold px-1.5 py-0.5 rounded border-l-2 ${c.border} truncate leading-tight" title="${LawLibra.Utils.esc(ev.title)}">${LawLibra.Utils.esc(ev.title)}</div>`;
        }).join("")}
        ${dayEvents.length > 2 ? `<div class="text-[10px] text-on-surface-variant font-semibold pl-1">+${dayEvents.length-2} more</div>` : ""}
      </div>
    </div>`;
  }
  // Fill remaining cells
  const total = startOffset + daysInMonth;
  const remainder = total % 7;
  if (remainder > 0) {
    for (let i = 0; i < 7 - remainder; i++) html += `<div class="day-cell border-b border-surface-container-low bg-surface-container-low/20 p-2"></div>`;
  }
  document.getElementById("cal-grid").innerHTML = html;
}

function renderDayEvents(dateStr) {
  if (!dateStr) return;
  const d = new Date(dateStr + "T00:00:00");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("selected-day-title").textContent = months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  const events = LawLibra.DB.events.forDate(dateStr).sort((a,b) => a.time.localeCompare(b.time));
  const el = document.getElementById("day-events");
  if (events.length === 0) {
    el.innerHTML = `<div class="py-6 text-center"><span class="material-symbols-outlined text-slate-300 text-3xl block mb-2">event_available</span><p class="text-xs text-on-surface-variant">No events scheduled</p><button onclick="openEventModal('${dateStr}')" class="mt-3 text-xs font-bold text-secondary hover:underline">Add event</button></div>`;
    return;
  }
  el.innerHTML = events.map(ev => {
    const c = getColor(ev.type);
    const cas = LawLibra.DB.cases.byId(ev.caseId);
    return `<div class="p-3 rounded-lg border-l-2 ${c.border} ${c.bg} group relative">
      <p class="text-[10px] font-bold ${c.text} uppercase mb-0.5">${ev.time} · ${ev.type}</p>
      <h4 class="text-sm font-bold text-on-surface leading-snug">${LawLibra.Utils.esc(ev.title)}</h4>
      ${cas?`<p class="text-[11px] text-on-surface-variant truncate mt-0.5">${LawLibra.Utils.esc(cas.title)}</p>`:""}
      <p class="text-[11px] text-on-surface-variant mt-0.5">${LawLibra.Utils.esc(ev.location||"")} ${ev.duration?"· "+ev.duration+"m":""}</p>
      <button onclick="deleteEvent('${ev.id}')" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity text-red-400 hover:text-red-600"><span class="material-symbols-outlined text-sm">delete</span></button>
    </div>`;
  }).join("");
}

function updateAIInsight() {
  const today    = new Date().toISOString().split("T")[0];
  const allEvents = LawLibra.DB.events.all();
  const upcoming  = allEvents.filter(e => e.date >= today);
  const hearings  = upcoming.filter(e => e.type === "HEARING");
  const thisMonth = LawLibra.DB.events.forMonth(viewYear, viewMonth);
  const thisMonthHearings = thisMonth.filter(e => e.type === "HEARING");

  let insight = "";
  if (!upcoming.length) {
    insight = "Your calendar is clear — no upcoming events scheduled. A quiet period is a good time to prepare briefs and review pending documents.";
  } else if (hearings.length >= 4) {
    insight = `You have ${hearings.length} upcoming hearings — a heavy court schedule. Prioritize preparation for the soonest hearing and consider delegating document review.`;
  } else if (hearings.length >= 2) {
    insight = `${hearings.length} hearings coming up alongside ${upcoming.length - hearings.length} other event(s). Ensure all briefs are filed at least 7 days before each hearing date.`;
  } else if (upcoming.length >= 5) {
    insight = `${upcoming.length} upcoming events across ${[...new Set(upcoming.map(e=>e.caseId))].length} case(s). Your schedule is active — review conflicts between dates.`;
  } else if (thisMonthHearings.length > 0) {
    const next = thisMonthHearings.sort((a,b)=>a.date.localeCompare(b.date))[0];
    insight = `Next hearing: <strong>${next.title}</strong> on ${next.date}. Prepare your arguments and evidence at least one week in advance.`;
  } else {
    insight = `${upcoming.length} upcoming event${upcoming.length!==1?"s":""} on your calendar. Schedule looks manageable — use this time to advance your cases strategically.`;
  }
  document.getElementById("ai-insight").innerHTML = insight;
}
function selectDay(dateStr) {
  selectedDate = dateStr;
  renderMiniCal(viewYear, viewMonth);
  renderMainCal(viewYear, viewMonth);
  renderDayEvents(dateStr);
}

function deleteEvent(id) {
  LawLibra.Modal.confirm("Delete Event", "Remove this event from the calendar?", () => {
    LawLibra.DB.events.delete(id);
    LawLibra.Modal.hide();
    LawLibra.Toast.success("Event deleted.");
    renderMainCal(viewYear, viewMonth);
    renderMiniCal(viewYear, viewMonth);
    renderDayEvents(selectedDate);
    updateAIInsight();
  }, "Delete", true);
}

function openEventModal(preDate) {
  const cases = LawLibra.DB.cases.all().filter(c => c.status === "OPEN");
  LawLibra.Modal.show(`
    <div class="p-6">
      <h3 class="font-headline font-bold text-xl text-slate-900 mb-5">Schedule Event</h3>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Event Title *</label><input id="ev-title" placeholder="e.g. Client Settlement Call" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Date *</label><input id="ev-date" type="date" value="${preDate||selectedDate||new Date().toISOString().split("T")[0]}" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
          <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Time *</label><input id="ev-time" type="time" value="09:00" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Type</label><select id="ev-type" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container appearance-none"><option value="HEARING">Hearing</option><option value="MEETING">Meeting</option><option value="REMINDER">Reminder</option></select></div>
          <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Duration (min)</label><input id="ev-duration" type="number" value="60" min="15" step="15" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
        </div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Linked Case</label><select id="ev-case" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container appearance-none"><option value="">— None —</option>${cases.map(c=>`<option value="${c.id}">${LawLibra.Utils.esc(c.title)}</option>`).join("")}</select></div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Location</label><input id="ev-location" placeholder="e.g. Court Room 3B" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
        <div id="ev-error" class="hidden text-red-600 text-xs bg-red-50 px-3 py-2 rounded-lg"></div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="ll-modal-cancel" class="flex-1 py-2.5 border border-slate-200 rounded-lg text-sm font-semibold">Cancel</button>
        <button id="ll-modal-confirm" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white" style="background:linear-gradient(135deg,#101c2e,#3c475b)">Create Event</button>
      </div>
    </div>`, function() {
    const title = document.getElementById("ev-title").value.trim();
    const date  = document.getElementById("ev-date").value;
    const time  = document.getElementById("ev-time").value;
    if (!title || !date || !time) { document.getElementById("ev-error").textContent="Title, date and time are required."; document.getElementById("ev-error").classList.remove("hidden"); return; }
    const u = LawLibra.Auth.currentUser();
    LawLibra.DB.events.create({
      title, date, time,
      type:     document.getElementById("ev-type").value,
      duration: parseInt(document.getElementById("ev-duration").value)||60,
      location: document.getElementById("ev-location").value,
      caseId:   document.getElementById("ev-case").value || null,
      createdBy: u?.id
    });
    LawLibra.Toast.success("Event scheduled!");
    LawLibra.Modal.hide();
    renderMainCal(viewYear, viewMonth);
    renderMiniCal(viewYear, viewMonth);
    if (date === selectedDate) renderDayEvents(selectedDate);
    updateAIInsight();
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const u = LawLibra.Auth.currentUser();
  if (u) document.getElementById("hdr-avatar").textContent = LawLibra.Utils.initials(u.name);

  const today = new Date();
  viewYear  = today.getFullYear();
  viewMonth = today.getMonth();
  selectedDate = today.toISOString().split("T")[0];

  renderMiniCal(viewYear, viewMonth);
  renderMainCal(viewYear, viewMonth);
  renderDayEvents(selectedDate);
  updateAIInsight();

  document.getElementById("prev-month").addEventListener("click", () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderMiniCal(viewYear, viewMonth); renderMainCal(viewYear, viewMonth);
    updateAIInsight();
  });
  document.getElementById("next-month").addEventListener("click", () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderMiniCal(viewYear, viewMonth); renderMainCal(viewYear, viewMonth);
    updateAIInsight();
  });
  document.querySelectorAll(".type-filter").forEach(cb => cb.addEventListener("change", () => renderMainCal(viewYear, viewMonth)));
  document.getElementById("dark-toggle")?.addEventListener("click", () => LawLibra.DarkMode.toggle());

  const unread = LawLibra.DB.notifications.all("*").filter(n=>!n.read).length;
  if (unread) document.getElementById("notif-badge")?.classList.remove("hidden");
});
</script>
</body></html>
