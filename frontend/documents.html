<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>LawLibra - Documents</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-surface":"#191c1e","on-surface-variant":"#45474c","background":"#f7f9fc","primary-container":"#101c2e","secondary":"#755b00","outline":"#75777d","outline-variant":"#c5c6cd","surface":"#f7f9fc","surface-container-lowest":"#ffffff","secondary-container":"#fed977","surface-container-low":"#f2f4f7","surface-container":"#eceef1","on-secondary-container":"#785d00","on-primary-container":"#79849b","error":"#ba1a1a"},fontFamily:{headline:["Manrope"],body:["Inter"]}}}}</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
:root{--sidebar-w:224px;}html,body{overflow-x:hidden;}
aside{width:var(--sidebar-w)!important;}.ll-main{margin-left:var(--sidebar-w);}
header.ll-topnav{left:var(--sidebar-w)!important;right:0!important;width:auto!important;}
.doc-card:hover .doc-actions{opacity:1;}
.doc-actions{opacity:0;transition:opacity 0.2s;}
</style>
</head>
<body class="bg-background text-on-surface font-body">
<aside id="ll-sidebar" class="bg-[#0D1F3C] h-screen fixed left-0 top-0 flex flex-col py-6 px-4 z-50 shadow-2xl"></aside>
<header class="ll-topnav fixed top-0 right-0 h-16 z-40 bg-white/90 backdrop-blur-xl flex items-center justify-between px-8 shadow-sm">
  <div class="flex items-center gap-4 flex-1 max-w-md"><div class="relative w-full"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span><input id="search-input" class="w-full bg-surface-container-low border-none rounded-xl pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-secondary-container transition-all" placeholder="Search documents, tags..." type="text"/></div></div>
  <div class="flex items-center gap-3">
    <button id="dark-toggle" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><span class="material-symbols-outlined">dark_mode</span></button>
    <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg relative"><span class="material-symbols-outlined">notifications</span><span id="notif-badge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full hidden"></span></button>
    <div class="h-8 w-px bg-outline-variant/30"></div>
    <div id="hdr-avatar" class="w-9 h-9 rounded-full bg-primary-container flex items-center justify-center text-amber-400 font-bold text-sm">?</div>
  </div>
</header>
<main class="ll-main mt-16 p-6 min-h-screen bg-background">
  <div class="flex items-end justify-between gap-4 mb-8">
    <div>
      <h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-1">Documents</h2>
      <p class="text-on-surface-variant text-sm" id="doc-count">Loading...</p>
    </div>
    <button onclick="uploadDoc()" class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-white shadow-lg hover:scale-[1.02] transition-all text-sm" style="background:linear-gradient(135deg,#101c2e,#3c475b)"><span class="material-symbols-outlined text-lg">upload</span>Upload Document</button>
  </div>
  <!-- Filters -->
  <div class="bg-surface-container-low rounded-xl p-3 mb-6 flex flex-wrap items-center gap-3">
    <div class="flex bg-surface-container-lowest rounded-lg p-1 shadow-sm gap-1">
      <button data-type="" class="type-tab px-3 py-1.5 rounded-md text-sm font-bold transition-all bg-primary-container text-white">All</button>
      <button data-type="pdf" class="type-tab px-3 py-1.5 rounded-md text-sm font-semibold text-slate-500 hover:bg-slate-100 transition-all">PDF</button>
      <button data-type="docx" class="type-tab px-3 py-1.5 rounded-md text-sm font-semibold text-slate-500 hover:bg-slate-100 transition-all">DOCX</button>
      <button data-type="xlsx" class="type-tab px-3 py-1.5 rounded-md text-sm font-semibold text-slate-500 hover:bg-slate-100 transition-all">XLSX</button>
    </div>
    <select id="case-filter" class="px-3 py-2 bg-surface-container-lowest border-none rounded-lg text-sm focus:ring-2 focus:ring-secondary-container shadow-sm">
      <option value="">All Cases</option>
    </select>
    <div class="flex bg-surface-container-lowest rounded-lg p-1 shadow-sm gap-1 ml-auto">
      <button id="view-grid" class="p-1.5 rounded-md bg-primary-container text-white transition-all" title="Grid view"><span class="material-symbols-outlined text-lg">grid_view</span></button>
      <button id="view-list" class="p-1.5 rounded-md text-slate-500 hover:bg-slate-100 transition-all" title="List view"><span class="material-symbols-outlined text-lg">view_list</span></button>
    </div>
  </div>
  <!-- Grid View -->
  <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  <!-- List View (hidden by default) -->
  <div id="list-container" class="hidden bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm">
    <table class="w-full text-left border-collapse">
      <thead><tr class="bg-surface-container-low/50"><th class="px-5 py-4 text-xs font-bold uppercase tracking-wider text-on-primary-container">Name</th><th class="px-5 py-4 text-xs font-bold uppercase tracking-wider text-on-primary-container">Case</th><th class="px-5 py-4 text-xs font-bold uppercase tracking-wider text-on-primary-container">Size</th><th class="px-5 py-4 text-xs font-bold uppercase tracking-wider text-on-primary-container">Tags</th><th class="px-5 py-4 text-xs font-bold uppercase tracking-wider text-on-primary-container">Uploaded</th><th class="px-5 py-4 text-xs font-bold uppercase tracking-wider text-on-primary-container text-right">Actions</th></tr></thead>
      <tbody id="list-tbody" class="divide-y divide-surface-container-low"></tbody>
    </table>
  </div>
  <div id="docs-empty" class="hidden p-16 text-center"><span class="material-symbols-outlined text-5xl text-slate-300 block mb-3">folder_off</span><p class="text-on-surface-variant">No documents match your filters.</p></div>
</main>
<script src="app.js"></script>
<script src="nav.js"></script>
<script>
let viewMode = "grid";
let activeType = "";

const FILE_ICONS = { pdf:"picture_as_pdf", docx:"article", xlsx:"table_chart" };
const FILE_COLORS = { pdf:"text-red-500 bg-red-50", docx:"text-blue-500 bg-blue-50", xlsx:"text-emerald-500 bg-emerald-50" };

function renderDocs() {
  const query = document.getElementById("search-input").value;
  const caseId = document.getElementById("case-filter").value;
  let docs = LawLibra.DB.documents.search(query, caseId);
  if (activeType) docs = docs.filter(d => d.type === activeType);

  document.getElementById("doc-count").textContent = `${docs.length} document${docs.length!==1?"s":""}`;
  const gridEl = document.getElementById("grid-container");
  const listEl = document.getElementById("list-tbody");
  const emptyEl = document.getElementById("docs-empty");

  if (!docs.length) { gridEl.innerHTML = ""; listEl.innerHTML = ""; emptyEl.classList.remove("hidden"); return; }
  emptyEl.classList.add("hidden");

  // Grid
  gridEl.innerHTML = docs.map(d => {
    const cas = LawLibra.DB.cases.byId(d.caseId);
    const uploader = LawLibra.DB.users.byId(d.uploadedBy);
    const col = FILE_COLORS[d.type] || "text-slate-500 bg-slate-50";
    const icon = FILE_ICONS[d.type] || "description";
    return `<div class="doc-card bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-all group relative">
      <div class="p-5 flex items-center justify-between">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center ${col}">
          <span class="material-symbols-outlined text-2xl" style="font-variation-settings:'FILL' 1">${icon}</span>
        </div>
        <div class="doc-actions flex items-center gap-1">
          <button onclick="viewDoc('${d.id}')" title="View" class="p-1.5 hover:bg-blue-50 text-blue-500 rounded-lg"><span class="material-symbols-outlined text-sm">visibility</span></button>
          <button onclick="deleteDoc('${d.id}')" title="Delete" class="p-1.5 hover:bg-red-50 text-red-500 rounded-lg"><span class="material-symbols-outlined text-sm">delete</span></button>
        </div>
      </div>
      <div class="px-5 pb-5">
        <h4 class="text-sm font-bold text-on-surface mb-1 truncate" title="${LawLibra.Utils.esc(d.name)}">${LawLibra.Utils.esc(d.name)}</h4>
        ${cas?`<a href="case_detail.html?id=${cas.id}" class="text-xs text-secondary font-semibold hover:underline truncate block">${LawLibra.Utils.esc(cas.title)}</a>`:"<p class='text-xs text-on-surface-variant'>No case</p>"}
        <div class="flex items-center gap-2 mt-3">
          <span class="text-[11px] text-on-surface-variant">${LawLibra.Utils.fmtFileSize(d.size)}</span>
          <span class="text-on-surface-variant">·</span>
          <span class="text-[11px] text-on-surface-variant">${LawLibra.Utils.fmtDate(d.uploadedAt)}</span>
        </div>
        <div class="flex flex-wrap gap-1 mt-2">
          ${(d.tags||[]).slice(0,3).map(t=>`<span class="text-[9px] font-bold bg-surface-container px-1.5 py-0.5 rounded text-on-surface-variant">${t}</span>`).join("")}
        </div>
      </div>
    </div>`;
  }).join("");

  // List
  listEl.innerHTML = docs.map(d => {
    const cas = LawLibra.DB.cases.byId(d.caseId);
    const col = FILE_COLORS[d.type] || "text-slate-500 bg-slate-50";
    const icon = FILE_ICONS[d.type] || "description";
    return `<tr class="hover:bg-surface-container-low/30 transition-colors group">
      <td class="px-5 py-4"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg flex items-center justify-center ${col} flex-shrink-0"><span class="material-symbols-outlined text-lg" style="font-variation-settings:'FILL' 1">${icon}</span></div><p class="text-sm font-semibold truncate max-w-[200px]">${LawLibra.Utils.esc(d.name)}</p></div></td>
      <td class="px-5 py-4">${cas?`<a href="case_detail.html?id=${cas.id}" class="text-xs font-semibold text-secondary hover:underline">${LawLibra.Utils.esc(cas.title)}</a>`:"<span class='text-xs text-slate-400'>—</span>"}</td>
      <td class="px-5 py-4 text-sm text-on-surface-variant">${LawLibra.Utils.fmtFileSize(d.size)}</td>
      <td class="px-5 py-4">${(d.tags||[]).map(t=>`<span class="text-[10px] font-bold bg-surface-container px-2 py-0.5 rounded mr-1">${t}</span>`).join("")}</td>
      <td class="px-5 py-4 text-sm text-on-surface-variant">${LawLibra.Utils.fmtDate(d.uploadedAt)}</td>
      <td class="px-5 py-4 text-right">
        <div class="flex items-center gap-2 justify-end opacity-0 group-hover:opacity-100 transition-opacity">
          <button onclick="viewDoc('${d.id}')" class="p-1.5 hover:bg-blue-50 text-blue-500 rounded-lg"><span class="material-symbols-outlined text-sm">visibility</span></button>
          <button onclick="deleteDoc('${d.id}')" class="p-1.5 hover:bg-red-50 text-red-500 rounded-lg"><span class="material-symbols-outlined text-sm">delete</span></button>
        </div>
      </td>
    </tr>`;
  }).join("");
}

function viewDoc(id) {
  const d = LawLibra.DB.documents.byId(id);
  if (!d) return;
  const cas = LawLibra.DB.cases.byId(d.caseId);
  const icon = FILE_ICONS[d.type] || "description";
  LawLibra.Modal.show(`
    <div class="p-6">
      <div class="flex items-center gap-4 mb-5">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center ${FILE_COLORS[d.type]||"text-slate-500 bg-slate-50"}">
          <span class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL' 1">${icon}</span>
        </div>
        <div><h3 class="font-headline font-bold text-lg">${LawLibra.Utils.esc(d.name)}</h3><p class="text-sm text-slate-500">${d.type.toUpperCase()} · ${LawLibra.Utils.fmtFileSize(d.size)}</p></div>
      </div>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between py-2 border-b border-slate-100"><span class="text-slate-500">Case</span><span class="font-semibold">${cas?LawLibra.Utils.esc(cas.title):"None"}</span></div>
        <div class="flex justify-between py-2 border-b border-slate-100"><span class="text-slate-500">Uploaded</span><span class="font-semibold">${LawLibra.Utils.fmtDate(d.uploadedAt)}</span></div>
        <div class="flex justify-between py-2 border-b border-slate-100"><span class="text-slate-500">Tags</span><span class="font-semibold">${(d.tags||[]).join(", ")||"None"}</span></div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="ll-modal-cancel" class="flex-1 py-2.5 border border-slate-200 rounded-lg text-sm font-semibold">Close</button>
        ${cas?`<a href="case_detail.html?id=${cas.id}?tab=documents" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white text-center" style="background:linear-gradient(135deg,#101c2e,#3c475b)">View Case</a>`:""}
      </div>
    </div>`);
}

function deleteDoc(id) {
  LawLibra.Modal.confirm("Delete Document", "Remove this document permanently?", () => {
    LawLibra.DB.documents.delete(id);
    LawLibra.Toast.success("Document deleted.");
    LawLibra.Modal.hide();
    renderDocs();
  }, "Delete", true);
}

function uploadDoc() {
  const cases = LawLibra.DB.cases.all();
  LawLibra.Modal.show(`
    <div class="p-6">
      <h3 class="font-headline font-bold text-xl text-slate-900 mb-5">Upload Document</h3>
      <div class="space-y-4">
        <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Document Name *</label><input id="doc-name" placeholder="e.g. Motion_to_Dismiss.pdf" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Type</label><select id="doc-type" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm appearance-none"><option value="pdf">PDF</option><option value="docx">DOCX</option><option value="xlsx">XLSX</option></select></div>
          <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Size (KB)</label><input id="doc-size" type="number" value="256" min="1" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
        </div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Linked Case</label><select id="doc-case" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm appearance-none"><option value="">— None —</option>${cases.map(c=>`<option value="${c.id}">${LawLibra.Utils.esc(c.title)}</option>`).join("")}</select></div>
        <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Tags (comma separated)</label><input id="doc-tags" placeholder="brief, evidence, exhibit" class="w-full bg-slate-50 border-none rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-secondary-container"/></div>
      </div>
      <div class="flex gap-3 mt-6"><button id="ll-modal-cancel" class="flex-1 py-2.5 border border-slate-200 rounded-lg text-sm font-semibold">Cancel</button><button id="ll-modal-confirm" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white" style="background:linear-gradient(135deg,#101c2e,#3c475b)">Upload</button></div>
    </div>`, function() {
    const name = document.getElementById("doc-name").value.trim();
    if (!name) { LawLibra.Toast.error("Document name is required."); return; }
    const u = LawLibra.Auth.currentUser();
    LawLibra.DB.documents.create({
      name,
      type:      document.getElementById("doc-type").value,
      size:      parseInt(document.getElementById("doc-size").value) * 1024,
      caseId:    document.getElementById("doc-case").value || null,
      tags:      document.getElementById("doc-tags").value.split(",").map(t=>t.trim()).filter(Boolean),
      uploadedBy: u?.id
    });
    LawLibra.Toast.success("Document uploaded!");
    LawLibra.Modal.hide();
    renderDocs();
  });
}

// View toggle
document.getElementById("view-grid").addEventListener("click", () => {
  viewMode = "grid";
  document.getElementById("grid-container").classList.remove("hidden");
  document.getElementById("list-container").classList.add("hidden");
  document.getElementById("view-grid").className = "p-1.5 rounded-md bg-primary-container text-white transition-all";
  document.getElementById("view-list").className = "p-1.5 rounded-md text-slate-500 hover:bg-slate-100 transition-all";
});
document.getElementById("view-list").addEventListener("click", () => {
  viewMode = "list";
  document.getElementById("list-container").classList.remove("hidden");
  document.getElementById("grid-container").classList.add("hidden");
  document.getElementById("view-list").className = "p-1.5 rounded-md bg-primary-container text-white transition-all";
  document.getElementById("view-grid").className = "p-1.5 rounded-md text-slate-500 hover:bg-slate-100 transition-all";
  renderDocs();
});

// Type tabs
document.querySelectorAll(".type-tab").forEach(btn => {
  btn.addEventListener("click", function() {
    activeType = this.dataset.type;
    document.querySelectorAll(".type-tab").forEach(b => { b.classList.remove("bg-primary-container","text-white"); b.classList.add("text-slate-500","hover:bg-slate-100"); });
    this.classList.add("bg-primary-container","text-white");
    this.classList.remove("text-slate-500","hover:bg-slate-100");
    renderDocs();
  });
});

document.addEventListener("DOMContentLoaded", () => {
  const u = LawLibra.Auth.currentUser();
  if (u) document.getElementById("hdr-avatar").textContent = LawLibra.Utils.initials(u.name);

  // Populate case filter
  const sel = document.getElementById("case-filter");
  LawLibra.DB.cases.all().forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = c.title; sel.appendChild(o); });

  // Check for highlight param
  const params = new URLSearchParams(window.location.search);
  const highlight = params.get("highlight");
  if (highlight) setTimeout(() => { const card = document.querySelector(`[data-id='${highlight}']`); card?.scrollIntoView({behavior:"smooth"}); }, 300);

  document.getElementById("search-input").addEventListener("input", renderDocs);
  sel.addEventListener("change", renderDocs);
  document.getElementById("dark-toggle")?.addEventListener("click", () => LawLibra.DarkMode.toggle());

  const unread = LawLibra.DB.notifications.all("*").filter(n=>!n.read).length;
  if (unread) document.getElementById("notif-badge")?.classList.remove("hidden");
  renderDocs();
});
</script>
</body></html>
