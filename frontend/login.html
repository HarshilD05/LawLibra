<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "background": "#f8f9fa",
                    "outline": "#74777f",
                    "on-background": "#191c1d",
                    "on-primary-fixed": "#001c3b",
                    "surface-container-highest": "#e1e3e4",
                    "on-primary-fixed-variant": "#2d486d",
                    "on-tertiary-fixed-variant": "#5c4300",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e7e8e9",
                    "primary-fixed": "#d5e3ff",
                    "primary-fixed-dim": "#adc8f5",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed": "#261a00",
                    "on-tertiary-container": "#ce9b0f",
                    "secondary-container": "#d6e0f4",
                    "on-surface": "#191c1d",
                    "secondary-fixed-dim": "#bdc7da",
                    "tertiary-fixed": "#ffdfa0",
                    "secondary-fixed": "#d9e3f7",
                    "surface": "#f8f9fa",
                    "primary": "#022448",
                    "surface-bright": "#f8f9fa",
                    "surface-container": "#edeeef",
                    "tertiary": "#302200",
                    "on-surface-variant": "#43474e",
                    "inverse-surface": "#2e3132",
                    "outline-variant": "#c4c6cf",
                    "surface-tint": "#455f87",
                    "primary-container": "#1e3a5f",
                    "surface-container-low": "#f3f4f5",
                    "tertiary-fixed-dim": "#f6be39",
                    "inverse-primary": "#adc8f5",
                    "inverse-on-surface": "#f0f1f2",
                    "on-primary-container": "#8aa4cf",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "surface-variant": "#e1e3e4",
                    "secondary": "#555f70",
                    "tertiary-container": "#4b3600",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "surface-dim": "#d9dadb",
                    "on-secondary-container": "#5a6374",
                    "on-secondary-fixed-variant": "#3e4757",
                    "on-secondary-fixed": "#121c2a"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-shift {
            background-color: #f3f4f5;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Shell Suppression applied: Login page excludes SideNavBar and TopNavBar per instructions -->
<main class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle Architectural Background Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
<div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-primary/5 blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-tertiary-fixed-dim/5 blur-3xl"></div>
</div>
<div class="w-full max-w-md z-10">
<!-- Branding Area -->
<div class="flex flex-col items-center mb-12">
<div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center shadow-lg mb-6">
<span class="material-symbols-outlined text-white text-3xl" data-icon="balance">balance</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-primary font-headline">LawLibra</h1>
<p class="text-on-surface-variant font-medium tracking-wide mt-1">Legal Management Excellence</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-[0_32px_64px_-12px_rgba(2,36,72,0.06)] border border-outline-variant/10">
<div class="mb-8">
<h2 class="text-xl font-bold text-on-surface">Secure Sign In</h2>
<p class="text-on-surface-variant text-sm mt-1">Access your legal workspace and case files</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 px-0 bg-surface-container-low border-b-2 border-primary/20 focus:border-primary transition-all duration-300 outline-none text-on-surface placeholder:text-outline-variant font-medium focus:ring-0 px-4 rounded-t-lg" id="email" placeholder="attorney@lawlibra.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-0 bg-surface-container-low border-b-2 border-primary/20 focus:border-primary transition-all duration-300 outline-none text-on-surface placeholder:text-outline-variant font-medium focus:ring-0 px-4 rounded-t-lg" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-2 space-y-4">
<button class="w-full h-12 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-lg shadow-md hover:shadow-xl transition-all duration-300 active:scale-95 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-lowest px-2 text-on-surface-variant font-semibold">Or enterprise access</span>
</div>
</div>
<button class="w-full h-12 bg-surface-container-low text-primary font-bold rounded-lg hover:bg-surface-container-high transition-all duration-200 flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-lg" data-icon="key">key</span>
<span>Single Sign-On (SSO)</span>
</button>
</div>
</form>
</div>
<!-- Footer Compliance Text -->
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex items-center gap-6 text-xs font-semibold text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Security Audit</a>
</div>
<div class="flex items-center gap-2 text-[10px] text-outline uppercase tracking-widest">
<span class="material-symbols-outlined text-sm" data-icon="encrypted">encrypted</span>
<span>AES-256 Bit Encryption Standard</span>
</div>
</div>
</div>
<!-- Decorative Sidebar Image for Large Viewports -->
<div class="hidden lg:block fixed right-0 top-0 w-1/3 h-full overflow-hidden">
<div class="w-full h-full relative">
<img alt="Law Library" class="object-cover w-full h-full grayscale brightness-50 contrast-125" data-alt="stately law library with rows of leather-bound books on dark wood shelves and a classic green banker lamp on a mahogany table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIaDRnO0QkHmpW93_jSmJqyBsBsnkUD2fS23IQFE8YqlFPnoGxCa1qNd1smAzGK87sNSulU7COgGA4fUPZLJ1IqMzwAzqtijPIjAGA5BrYLkxuOaq-rOr_TrHO83156QA_Z33GDLLkXaKGOyYKutGGRn9HHzUsFzZRGmUskm-eGDJHWFwBvz_VeG4MkFHJhH4OkWn01u-GhEjaTMisvEP4QJDM8HexSSOE3CosPF3KyKsm7Vpi8ALZYBW7Gfeer34zmg1ubDo2lZ4"/>
<div class="absolute inset-0 bg-gradient-to-l from-transparent to-surface"></div>
<div class="absolute bottom-12 left-12 right-12">
<blockquote class="text-white">
<p class="text-2xl font-light italic opacity-90 leading-relaxed">"The law is reason, free from passion."</p>
<footer class="mt-4 text-sm font-bold uppercase tracking-widest text-tertiary-fixed-dim">— Aristotle</footer>
</blockquote>
</div>
</div>
</div>
</main>
</body></html>
