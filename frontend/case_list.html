<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LawLibra - Case Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode:"class",
    theme:{extend:{colors:{"on-surface":"#191c1e","on-surface-variant":"#45474c","background":"#f7f9fc","primary-container":"#101c2e","primary":"#000000","error":"#ba1a1a","error-container":"#ffdad6","surface":"#f7f9fc","surface-variant":"#e0e3e6","on-tertiary-container":"#7484a6","outline":"#75777d","secondary":"#755b00","tertiary-fixed-dim":"#b6c7ec","on-tertiary-fixed":"#081b38","on-background":"#191c1e","on-primary-fixed-variant":"#3c475b","outline-variant":"#c5c6cd","on-primary":"#ffffff","on-primary-container":"#79849b","secondary-container":"#fed977","on-secondary-container":"#785d00","surface-container-lowest":"#ffffff","inverse-on-surface":"#eff1f4","surface-container-highest":"#e0e3e6","surface-container-low":"#f2f4f7","surface-container":"#eceef1","surface-container-high":"#e6e8eb","on-secondary":"#ffffff","tertiary-container":"#081b38","on-tertiary":"#ffffff","on-error":"#ffffff"},fontFamily:{"headline":["Manrope"],"body":["Inter"],"label":["Inter"]}}}
  }
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .signature-gradient{background:linear-gradient(135deg,#101c2e 0%,#3c475b 100%)}
  html,body{overflow-x:hidden;max-width:100vw}
  :root{--sidebar-w:224px}
  aside{width:var(--sidebar-w)!important}
  header.ll-topnav{left:var(--sidebar-w)!important;right:0!important;width:auto!important}
  .font-headline.text-4xl,h2.text-4xl{font-size:1.5rem!important;line-height:2rem!important}
  .text-3xl.font-black{font-size:1.6rem!important}
  .overflow-x-auto{overflow-x:auto;max-width:100%}
  aside nav a,aside .space-y-0\.5 a,aside button{font-size:0.8125rem!important}
  #ll-notif-panel,#ll-profile-panel{position:absolute}
  .filter-btn.active{background:#0D1F3C;color:#fff}
</style>
</head>
<body class="bg-surface font-body text-on-surface antialiased">
<aside id="ll-sidebar" class="bg-[#0D1F3C] dark:bg-[#06101F] h-screen w-56 fixed left-0 top-0 flex flex-col py-6 px-4 shadow-2xl z-50 overflow-y-auto"></aside>
<header class="ll-topnav fixed top-0 right-0 left-56 h-16 z-40 bg-white/80 backdrop-blur-xl flex items-center justify-between px-8 shadow-sm">
  <div class="flex-1 max-w-xl">
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3 text-slate-400">search</span>
      <input id="hdr-search" class="w-full bg-surface-container-low border-none rounded-lg py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-secondary/20 placeholder:text-slate-500 transition-all" placeholder="Search cases, clients, case numbers..." type="text"/>
    </div>
  </div>
  <div class="flex items-center gap-6">
    <button class="text-slate-500 hover:bg-slate-100 p-2 rounded-lg transition-all">
      <span class="material-symbols-outlined">notifications</span>
    </button>
    <div class="h-8 w-[1px] bg-outline-variant/30"></div>
    <div class="flex items-center gap-3 cursor-pointer" id="profile-trigger">
      <div id="hdr-avatar" class="w-8 h-8 rounded-full bg-[#101c2e] flex items-center justify-center text-amber-400 font-bold text-xs"></div>
    </div>
  </div>
</header>
<main class="ml-[224px] mt-14 p-6 min-h-screen">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8">
    <div>
      <h2 class="text-4xl font-extrabold tracking-tight text-on-surface font-headline mb-2">Cases</h2>
      <p class="text-on-surface-variant font-medium">Manage your active litigation and legal documentation.</p>
    </div>
    <button id="btn-new-case" class="signature-gradient text-white flex items-center gap-2 px-6 py-3 rounded-lg font-semibold shadow-lg hover:shadow-xl transition-all active:scale-95">
      <span class="material-symbols-outlined">add</span><span>New Case</span>
    </button>
  </div>
  <!-- Filter Bar -->
  <div class="bg-surface-container-low rounded-xl p-2 mb-6 flex flex-col lg:flex-row items-center justify-between gap-4">
    <div class="flex bg-surface-container-lowest rounded-lg p-1 shadow-sm w-full lg:w-auto gap-1">
      <button class="filter-btn active px-5 py-2 rounded-md text-sm font-bold transition-all" data-filter="ALL">All</button>
      <button class="filter-btn px-5 py-2 rounded-md text-slate-500 hover:bg-slate-100 text-sm font-semibold transition-all" data-filter="OPEN">Open</button>
      <button class="filter-btn px-5 py-2 rounded-md text-slate-500 hover:bg-slate-100 text-sm font-semibold transition-all" data-filter="CLOSED">Closed</button>
      <button class="filter-btn px-5 py-2 rounded-md text-slate-500 hover:bg-slate-100 text-sm font-semibold transition-all" data-filter="ARCHIVED">Archived</button>
    </div>
    <div class="relative w-full lg:max-w-xs px-2">
      <span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">filter_list</span>
      <input id="quick-filter" class="w-full bg-surface-container-lowest border-none rounded-lg py-2.5 px-4 text-sm focus:ring-0 shadow-sm" placeholder="Quick filter..." type="text"/>
    </div>
  </div>
  <!-- Cases Table -->
  <div class="bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-surface-container-low/50">
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Case Title</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Client</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Court / Case No.</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container text-center">Status</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Next Hearing</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="cases-tbody" class="divide-y divide-surface-container-low">
        <tr><td colspan="6" class="px-6 py-10 text-center text-on-surface-variant">Loading…</td></tr>
      </tbody>
    </table>
    <div class="px-6 py-4 bg-surface-container-low/30 flex items-center justify-between">
      <p id="count-label" class="text-xs text-on-surface-variant font-medium">Loading…</p>
    </div>
  </div>
</main>

<!-- New Case Modal -->
<div id="new-case-modal" class="hidden fixed inset-0 z-[8000] bg-[#101c2e]/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
    <div class="signature-gradient px-6 py-5">
      <h3 class="font-headline text-lg font-bold text-white">Create New Case</h3>
    </div>
    <div class="p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Case Title *</label>
          <input id="nc-title" type="text" placeholder="e.g. Smith vs. Acme Corp" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
        </div>
        <div>
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Client Name *</label>
          <input id="nc-client" type="text" placeholder="Client full name" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
        </div>
        <div>
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Case Type</label>
          <select id="nc-type" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30">
            <option>Contract Dispute</option><option>Criminal Defense</option><option>Intellectual Property</option>
            <option>Corporate</option><option>Tax Law</option><option>Probate &amp; Estates</option><option>Civil Litigation</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Court Name</label>
          <input id="nc-court" type="text" placeholder="e.g. US District Court" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
        </div>
        <div>
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Case Number</label>
          <input id="nc-num" type="text" placeholder="e.g. CV-2025-001" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
        </div>
        <div class="col-span-2">
          <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Description</label>
          <textarea id="nc-desc" rows="2" placeholder="Brief description of the case…" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30 resize-none"></textarea>
        </div>
      </div>
    </div>
    <div class="px-6 pb-6 flex justify-end gap-3">
      <button id="nc-cancel" class="px-5 py-2 rounded-lg border border-outline-variant text-sm font-semibold text-on-surface-variant hover:bg-surface-container-low transition-colors">Cancel</button>
      <button id="nc-save" class="signature-gradient px-6 py-2 rounded-lg text-sm font-bold text-white hover:opacity-90 transition-opacity">Create Case</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
(function(){if(!localStorage.getItem("ll_token")){window.location.replace("login_page.html");}})();
</script>
<script src="nav.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const LL = window.LawLibra;
  if (!LL) return;
  const user = LL.Auth.currentUser() || {};
  const av = document.getElementById("hdr-avatar");
  if (av) av.textContent = LL.Utils.initials(user.name);

  let currentFilter = "ALL";
  let currentQuery  = "";

  function renderCases() {
    const all = LL.DB.cases.search(currentQuery, currentFilter === "ALL" ? "" : currentFilter);
    const tbody = document.getElementById("cases-tbody");
    document.getElementById("count-label").textContent = `Showing ${all.length} case${all.length !== 1 ? "s" : ""}`;
    if (all.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-on-surface-variant text-sm">No cases found.</td></tr>`;
      return;
    }
    tbody.innerHTML = all.map(c => `
      <tr class="hover:bg-surface-container-low/30 transition-colors group cursor-pointer" onclick="location.href='case_detail.html?id=${c.id}'">
        <td class="px-6 py-5">
          <div class="flex items-center gap-3">
            <div class="w-1.5 h-8 bg-secondary rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div>
              <p class="text-sm font-bold text-on-surface">${LL.Utils.esc(c.title)}</p>
              <p class="text-xs text-on-surface-variant mt-0.5">${LL.Utils.esc(c.type)}</p>
            </div>
          </div>
        </td>
        <td class="px-6 py-5">
          <p class="text-sm font-semibold">${LL.Utils.esc(c.clientName)}</p>
        </td>
        <td class="px-6 py-5">
          <p class="text-sm text-on-surface">${LL.Utils.esc(c.courtName || "—")}</p>
          <p class="text-xs font-mono text-slate-500">${LL.Utils.esc(c.caseNumber)}</p>
        </td>
        <td class="px-6 py-5 text-center">${LL.Utils.statusBadge(c.status)}</td>
        <td class="px-6 py-5">
          ${c.nextHearing
            ? `<div class="flex items-center gap-2"><span class="material-symbols-outlined text-sm text-secondary">calendar_today</span><p class="text-sm font-medium">${LL.Utils.fmtDate(c.nextHearing)}</p></div>`
            : `<span class="text-slate-400 text-xs italic">None scheduled</span>`}
        </td>
        <td class="px-6 py-5 text-right" onclick="event.stopPropagation()">
          <div class="flex items-center justify-end gap-1">
            <button class="p-2 hover:bg-surface-container-high rounded-lg transition-all text-slate-400 hover:text-primary-container" onclick="location.href='case_detail.html?id=${c.id}'" title="View">
              <span class="material-symbols-outlined text-sm">open_in_new</span>
            </button>
            <button class="p-2 hover:bg-red-50 rounded-lg transition-all text-slate-400 hover:text-red-600" onclick="deleteCase('${c.id}', '${LL.Utils.esc(c.title)}')" title="Delete">
              <span class="material-symbols-outlined text-sm">delete</span>
            </button>
          </div>
        </td>
      </tr>`).join("");
  }

  window.deleteCase = function(id, title) {
    LL.Modal.confirm("Delete Case", `Are you sure you want to delete "${title}"? This cannot be undone.`, () => {
      LL.DB.cases.delete(id);
      LL.Toast.success("Case deleted.");
      LL.Modal.hide();
      renderCases();
    }, "Delete", true);
  };

  // Filter buttons
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => { b.classList.remove("active","bg-[#0D1F3C]","text-white"); b.classList.add("text-slate-500"); });
      btn.classList.add("active");
      btn.classList.remove("text-slate-500");
      currentFilter = btn.dataset.filter;
      renderCases();
    });
  });

  // Quick filter + header search
  ["quick-filter","hdr-search"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", () => { currentQuery = el.value.trim(); renderCases(); });
  });

  // New Case Modal
  const modal = document.getElementById("new-case-modal");
  document.getElementById("btn-new-case").addEventListener("click", () => modal.classList.remove("hidden"));
  document.getElementById("nc-cancel").addEventListener("click", () => modal.classList.add("hidden"));
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.add("hidden"); });
  document.getElementById("nc-save").addEventListener("click", () => {
    const title  = document.getElementById("nc-title").value.trim();
    const client = document.getElementById("nc-client").value.trim();
    if (!title || !client) { LL.Toast.warning("Title and client name are required."); return; }
    LL.DB.cases.create({
      title, clientName: client,
      type: document.getElementById("nc-type").value,
      courtName: document.getElementById("nc-court").value.trim(),
      caseNumber: document.getElementById("nc-num").value.trim() || ("LL-" + Date.now().toString(36).toUpperCase()),
      description: document.getElementById("nc-desc").value.trim(),
      status: "OPEN", priority: "MEDIUM", assignedTo: [user.id]
    });
    LL.Toast.success("Case created!");
    modal.classList.add("hidden");
    ["nc-title","nc-client","nc-court","nc-num","nc-desc"].forEach(id => document.getElementById(id).value = "");
    renderCases();
  });

  renderCases();
});
</script>
</body></html>
