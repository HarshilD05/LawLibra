<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LawLibra - User Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-surface":"#191c1e","on-surface-variant":"#45474c","background":"#f7f9fc","primary-container":"#101c2e","error":"#ba1a1a","surface":"#f7f9fc","surface-variant":"#e0e3e6","outline":"#75777d","secondary":"#755b00","secondary-container":"#fed977","on-secondary-container":"#785d00","outline-variant":"#c5c6cd","on-primary":"#ffffff","on-primary-container":"#79849b","surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f7","surface-container":"#eceef1","surface-container-high":"#e6e8eb","on-secondary":"#ffffff","on-error":"#ffffff","on-tertiary-container":"#7484a6"},fontFamily:{"headline":["Manrope"],"body":["Inter"]}}}}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .primary-gradient{background:linear-gradient(135deg,#101c2e 0%,#3c475b 100%)}
  html,body{overflow-x:hidden;max-width:100vw}
  :root{--sidebar-w:224px}
  aside{width:var(--sidebar-w)!important}
  header.ll-topnav{left:var(--sidebar-w)!important;right:0!important;width:auto!important}
  .font-headline.text-4xl,h2.text-4xl{font-size:1.5rem!important;line-height:2rem!important}
  .overflow-x-auto{overflow-x:auto;max-width:100%}
  aside nav a,aside button{font-size:0.8125rem!important}
  #ll-notif-panel,#ll-profile-panel{position:absolute}
</style>
</head>
<body class="bg-surface font-body text-on-surface">
<aside id="ll-sidebar" class="bg-[#0D1F3C] dark:bg-[#06101F] h-screen w-56 fixed left-0 top-0 flex flex-col py-6 px-4 shadow-2xl z-50"></aside>
<header class="ll-topnav fixed top-0 right-0 left-56 h-16 z-40 bg-white/80 backdrop-blur-xl flex items-center justify-between px-8 shadow-sm">
  <div class="flex-1 max-w-xl">
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3 text-slate-400">search</span>
      <input id="user-search" class="w-full bg-surface-container-low border-none rounded-lg py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-secondary/20 placeholder:text-slate-500" placeholder="Search users by name or email..." type="text"/>
    </div>
  </div>
  <div class="flex items-center gap-6">
    <button class="text-slate-500 hover:bg-slate-100 p-2 rounded-lg transition-all"><span class="material-symbols-outlined">notifications</span></button>
    <div class="h-8 w-[1px] bg-outline-variant/30"></div>
    <div class="flex items-center gap-3 cursor-pointer" id="profile-trigger">
      <div id="hdr-avatar" class="w-8 h-8 rounded-full bg-[#101c2e] flex items-center justify-center text-amber-400 font-bold text-xs"></div>
    </div>
  </div>
</header>
<main class="ml-[224px] mt-14 p-6 min-h-screen">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8">
    <div>
      <h2 class="text-4xl font-extrabold tracking-tight text-on-surface font-headline mb-2">User Management</h2>
      <p class="text-on-surface-variant font-medium">Manage firm members, roles, and access levels.</p>
    </div>
    <button id="btn-invite" class="primary-gradient text-white flex items-center gap-2 px-6 py-3 rounded-lg font-semibold shadow-lg hover:shadow-xl transition-all active:scale-95">
      <span class="material-symbols-outlined">person_add</span><span>Invite User</span>
    </button>
  </div>

  <!-- Stats Row -->
  <div class="grid grid-cols-3 gap-4 mb-8">
    <div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1">Total Members</p>
      <p id="stat-total" class="text-2xl font-black font-headline text-primary-container">—</p>
    </div>
    <div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1">Admins</p>
      <p id="stat-admins" class="text-2xl font-black font-headline text-primary-container">—</p>
    </div>
    <div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1">Lawyers</p>
      <p id="stat-lawyers" class="text-2xl font-black font-headline text-primary-container">—</p>
    </div>
  </div>

  <!-- Users Table -->
  <div class="bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-surface-container-low/50">
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Member</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Email</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container text-center">Role</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container text-center">Status</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container">Joined</th>
          <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-on-tertiary-container text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody" class="divide-y divide-surface-container-low">
        <tr><td colspan="6" class="px-6 py-10 text-center text-on-surface-variant">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Invite User Modal -->
<div id="invite-modal" class="hidden fixed inset-0 z-[8000] bg-[#101c2e]/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
    <div class="primary-gradient px-6 py-5">
      <h3 class="font-headline text-lg font-bold text-white">Invite New Member</h3>
      <p class="text-slate-300 text-xs mt-1">They will be added to the firm immediately</p>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Full Name *</label>
        <input id="inv-name" type="text" placeholder="e.g. Jane Smith, J.D." class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
      </div>
      <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Email Address *</label>
        <input id="inv-email" type="email" placeholder="jane@lawfirm.com" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
      </div>
      <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Temporary Password *</label>
        <input id="inv-pw" type="password" placeholder="Min. 8 characters" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30"/>
      </div>
      <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1 block">Role</label>
        <select id="inv-role" class="w-full rounded-lg border border-outline-variant/50 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-secondary/30">
          <option value="LAWYER">Lawyer</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>
    <div class="px-6 pb-6 flex justify-end gap-3">
      <button id="inv-cancel" class="px-5 py-2 rounded-lg border border-outline-variant text-sm font-semibold text-on-surface-variant hover:bg-surface-container-low transition-colors">Cancel</button>
      <button id="inv-save" class="primary-gradient px-6 py-2 rounded-lg text-sm font-bold text-white hover:opacity-90 transition-opacity">Add Member</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>(function(){if(!localStorage.getItem("ll_token")){window.location.replace("login_page.html");}})();</script>
<script src="nav.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const LL = window.LawLibra;
  if (!LL) return;
  const currentUser = LL.Auth.currentUser() || {};
  if (currentUser.role !== "ADMIN") {
    LL.Toast.warning("Admin access required.");
    setTimeout(() => window.location.href = "dashboard.html", 1500);
    return;
  }
  const av = document.getElementById("hdr-avatar");
  if (av) av.textContent = LL.Utils.initials(currentUser.name);

  let query = "";

  function renderUsers() {
    const all = LL.DB.users.all().filter(u => {
      if (!query) return true;
      const q = query.toLowerCase();
      return u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
    });
    document.getElementById("stat-total").textContent  = LL.DB.users.all().length;
    document.getElementById("stat-admins").textContent = LL.DB.users.all().filter(u => u.role === "ADMIN").length;
    document.getElementById("stat-lawyers").textContent= LL.DB.users.all().filter(u => u.role === "LAWYER").length;

    const tbody = document.getElementById("users-tbody");
    if (all.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-on-surface-variant">No users found.</td></tr>`;
      return;
    }
    tbody.innerHTML = all.map(u => {
      const isSelf = u.id === currentUser.id;
      const initials = LL.Utils.initials(u.name);
      const roleBg = u.role === "ADMIN" ? "bg-amber-100 text-amber-700" : "bg-blue-100 text-blue-700";
      const statusBg = u.active ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500";
      return `<tr class="hover:bg-surface-container-low/30 transition-colors">
        <td class="px-6 py-5">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-[#101c2e] flex items-center justify-center text-amber-400 text-xs font-bold flex-shrink-0">${initials}</div>
            <div>
              <p class="text-sm font-bold text-on-surface">${LL.Utils.esc(u.name)} ${isSelf ? '<span class="text-[10px] bg-secondary-container text-on-secondary-container px-1.5 py-0.5 rounded font-bold ml-1">YOU</span>' : ""}</p>
            </div>
          </div>
        </td>
        <td class="px-6 py-5 text-sm text-on-surface-variant">${LL.Utils.esc(u.email)}</td>
        <td class="px-6 py-5 text-center"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${roleBg}">${u.role}</span></td>
        <td class="px-6 py-5 text-center"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusBg}">${u.active ? "Active" : "Inactive"}</span></td>
        <td class="px-6 py-5 text-sm text-on-surface-variant">${LL.Utils.fmtDate(u.createdAt)}</td>
        <td class="px-6 py-5 text-right">
          ${isSelf ? '<span class="text-xs text-on-surface-variant italic">—</span>' : `
          <div class="flex items-center justify-end gap-1">
            <button class="p-2 hover:bg-surface-container-high rounded-lg transition-all text-slate-400 hover:text-amber-600" onclick="toggleUser('${u.id}','${!u.active}')" title="${u.active ? 'Deactivate' : 'Activate'}">
              <span class="material-symbols-outlined text-sm">${u.active ? 'person_off' : 'person'}</span>
            </button>
            <button class="p-2 hover:bg-red-50 rounded-lg transition-all text-slate-400 hover:text-red-600" onclick="deleteUser('${u.id}','${LL.Utils.esc(u.name)}')" title="Delete">
              <span class="material-symbols-outlined text-sm">delete</span>
            </button>
          </div>`}
        </td>
      </tr>`;
    }).join("");
  }

  window.toggleUser = function(id, makeActive) {
    LL.DB.users.update(id, { active: makeActive === "true" || makeActive === true });
    LL.Toast.success("User status updated.");
    renderUsers();
  };
  window.deleteUser = function(id, name) {
    LL.Modal.confirm("Delete User", `Remove "${name}" from the firm? This cannot be undone.`, () => {
      LL.DB.users.delete(id);
      LL.Modal.hide();
      LL.Toast.success("User removed.");
      renderUsers();
    }, "Remove", true);
  };

  document.getElementById("user-search").addEventListener("input", e => { query = e.target.value; renderUsers(); });

  // Modal
  const modal = document.getElementById("invite-modal");
  document.getElementById("btn-invite").addEventListener("click", () => modal.classList.remove("hidden"));
  document.getElementById("inv-cancel").addEventListener("click", () => modal.classList.add("hidden"));
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.add("hidden"); });
  document.getElementById("inv-save").addEventListener("click", async function() {
    const name  = document.getElementById("inv-name").value.trim();
    const email = document.getElementById("inv-email").value.trim();
    const pw    = document.getElementById("inv-pw").value;
    const role  = document.getElementById("inv-role").value;
    if (!name || !email || !pw) { LL.Toast.warning("All fields are required."); return; }
    LL.Loading.btn(this, "Adding…");
    const result = await LL.Auth.register(name, email, pw, role);
    LL.Loading.btnReset(this);
    if (result.error) { LL.Toast.error(result.error); return; }
    LL.Toast.success(`${name} added to the firm!`);
    modal.classList.add("hidden");
    ["inv-name","inv-email","inv-pw"].forEach(id => document.getElementById(id).value = "");
    renderUsers();
  });

  renderUsers();
});
</script>
</body></html>
