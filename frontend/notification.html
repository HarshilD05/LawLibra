<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>LawLibra - Notifications</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-surface":"#191c1e","on-surface-variant":"#45474c","background":"#f7f9fc","primary-container":"#101c2e","secondary":"#755b00","outline":"#75777d","outline-variant":"#c5c6cd","surface":"#f7f9fc","surface-container-lowest":"#ffffff","secondary-container":"#fed977","surface-container-low":"#f2f4f7","surface-container":"#eceef1","on-secondary-container":"#785d00","on-primary-container":"#79849b","error":"#ba1a1a"},fontFamily:{headline:["Manrope"],body:["Inter"]}}}}</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
:root{--sidebar-w:224px;}html,body{overflow-x:hidden;}
aside{width:var(--sidebar-w)!important;}.ll-main{margin-left:var(--sidebar-w);}
header.ll-topnav{left:var(--sidebar-w)!important;right:0!important;width:auto!important;}
</style>
</head>
<body class="bg-background text-on-surface font-body">
<aside id="ll-sidebar" class="bg-[#0D1F3C] h-screen fixed left-0 top-0 flex flex-col py-6 px-4 z-50 shadow-2xl"></aside>
<header class="ll-topnav fixed top-0 right-0 h-16 z-40 bg-white/90 backdrop-blur-xl flex items-center justify-between px-8 shadow-sm">
  <div class="flex items-center gap-4 flex-1 max-w-md"><div class="relative w-full"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span><input class="w-full bg-surface-container-low border-none rounded-xl pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-secondary-container transition-all" placeholder="Search..." type="text"/></div></div>
  <div class="flex items-center gap-3">
    <button id="dark-toggle" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><span class="material-symbols-outlined">dark_mode</span></button>
    <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><span class="material-symbols-outlined">notifications</span></button>
    <div class="h-8 w-px bg-outline-variant/30"></div>
    <div id="hdr-avatar" class="w-9 h-9 rounded-full bg-primary-container flex items-center justify-center text-amber-400 font-bold text-sm">?</div>
  </div>
</header>
<main class="ll-main mt-16 p-6 min-h-screen bg-background max-w-4xl">
  <div class="flex items-end justify-between gap-4 mb-8">
    <div>
      <h2 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-1">Notifications</h2>
      <p class="text-on-surface-variant text-sm" id="notif-count">Loading...</p>
    </div>
    <div class="flex gap-3">
      <button onclick="markAllRead()" class="flex items-center gap-2 px-4 py-2.5 border border-outline-variant/50 rounded-lg text-sm font-bold hover:bg-white transition-all"><span class="material-symbols-outlined text-lg">done_all</span>Mark all read</button>
      <button onclick="clearRead()" class="flex items-center gap-2 px-4 py-2.5 border border-outline-variant/50 rounded-lg text-sm font-bold hover:bg-white transition-all text-red-600 border-red-200"><span class="material-symbols-outlined text-lg">delete_sweep</span>Clear read</button>
    </div>
  </div>
  <!-- Filter tabs -->
  <div class="flex gap-2 mb-6 bg-surface-container-low p-1 rounded-xl w-fit">
    <button data-filter="all"    class="notif-filter-btn px-4 py-2 rounded-lg text-sm font-bold bg-white text-primary-container shadow-sm transition-all">All</button>
    <button data-filter="unread" class="notif-filter-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:bg-white/60 transition-all">Unread</button>
    <button data-filter="read"   class="notif-filter-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:bg-white/60 transition-all">Read</button>
  </div>
  <!-- Notifications list -->
  <div id="notif-list" class="space-y-3"></div>
  <div id="notif-empty" class="hidden py-20 text-center">
    <div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center mx-auto mb-4">
      <span class="material-symbols-outlined text-slate-400 text-3xl">notifications_off</span>
    </div>
    <p class="text-on-surface-variant font-medium">No notifications found.</p>
  </div>
</main>
<script src="app.js"></script>
<script src="nav.js"></script>
<script>
let activeFilter = "all";

const TYPE_CONFIG = {
  hearing:  { icon:"gavel",       color:"bg-amber-100 text-amber-600",  border:"border-amber-400" },
  document: { icon:"description", color:"bg-blue-100 text-blue-600",    border:"border-blue-400" },
  case:     { icon:"folder_open", color:"bg-slate-100 text-slate-600",  border:"border-slate-400" },
  ai:       { icon:"auto_awesome",color:"bg-purple-100 text-purple-600",border:"border-purple-400" },
};
const DEFAULT_TYPE = { icon:"notifications", color:"bg-slate-100 text-slate-600", border:"border-slate-300" };

function getNotifs() {
  return LawLibra.DB.notifications.all("*").sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function renderNotifs() {
  let notifs = getNotifs();
  if (activeFilter === "unread") notifs = notifs.filter(n => !n.read);
  if (activeFilter === "read")   notifs = notifs.filter(n => n.read);

  const unread = getNotifs().filter(n=>!n.read).length;
  document.getElementById("notif-count").textContent = `${notifs.length} notification${notifs.length!==1?"s":" "} · ${unread} unread`;

  const el = document.getElementById("notif-list");
  const emptyEl = document.getElementById("notif-empty");
  if (!notifs.length) { el.innerHTML = ""; emptyEl.classList.remove("hidden"); return; }
  emptyEl.classList.add("hidden");

  el.innerHTML = notifs.map(n => {
    const cfg = TYPE_CONFIG[n.type] || DEFAULT_TYPE;
    return `<div class="group relative bg-surface-container-lowest rounded-xl p-5 border-l-4 ${n.read?"border-transparent opacity-70":"${cfg.border} shadow-sm"} hover:shadow-md hover:opacity-100 transition-all flex items-start gap-5" id="notif-${n.id}">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ${cfg.color}">
        <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1">${cfg.icon}</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2 mb-1">
          <h3 class="font-bold text-on-surface ${n.read?"":"text-base"}">${LawLibra.Utils.esc(n.title)}</h3>
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-xs text-on-surface-variant">${LawLibra.Utils.relTime(n.createdAt)}</span>
            ${!n.read?`<div class="w-2 h-2 bg-blue-500 rounded-full"></div>`:""}
          </div>
        </div>
        <p class="text-sm text-on-surface-variant leading-relaxed">${LawLibra.Utils.esc(n.message)}</p>
        <div class="flex items-center gap-4 mt-3">
          ${!n.read?`<button onclick="markOne('${n.id}')" class="text-xs font-bold text-secondary uppercase tracking-wide hover:underline">Mark as read</button>`:""}
          <button onclick="deleteNotif('${n.id}')" class="text-xs font-bold text-slate-400 uppercase tracking-wide hover:text-red-500 transition-colors">Dismiss</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function markOne(id) {
  LawLibra.DB.notifications.markRead(id);
  renderNotifs();
}

function markAllRead() {
  const user = LawLibra.Auth.currentUser();
  LawLibra.DB.notifications.markAllRead(user?.id);
  LawLibra.Toast.success("All notifications marked as read.");
  renderNotifs();
}

function clearRead() {
  const ns = (LawLibra.Store.get("notifications") || []).filter(n => !n.read);
  LawLibra.Store.set("notifications", ns);
  LawLibra.Toast.success("Read notifications cleared.");
  renderNotifs();
}

function deleteNotif(id) {
  const ns = (LawLibra.Store.get("notifications") || []).filter(n => n.id !== id);
  LawLibra.Store.set("notifications", ns);
  renderNotifs();
}

document.querySelectorAll(".notif-filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    activeFilter = this.dataset.filter;
    document.querySelectorAll(".notif-filter-btn").forEach(b => { b.className = "notif-filter-btn px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:bg-white/60 transition-all"; });
    this.className = "notif-filter-btn px-4 py-2 rounded-lg text-sm font-bold bg-white text-primary-container shadow-sm transition-all";
    renderNotifs();
  });
});

document.addEventListener("DOMContentLoaded", () => {
  const u = LawLibra.Auth.currentUser();
  if (u) document.getElementById("hdr-avatar").textContent = LawLibra.Utils.initials(u.name);
  document.getElementById("dark-toggle")?.addEventListener("click", () => LawLibra.DarkMode.toggle());
  renderNotifs();
});
</script>
</body></html>
